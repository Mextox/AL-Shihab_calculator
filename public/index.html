<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الشهاب</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=DEV">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="loading-screen">
        <div class="loader">
            <img src="logo.png" alt="الشهاب" class="loader-logo">
            <p>جاري التحميل...</p>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="logo.png" alt="الشهاب لاستيراد السيارات" class="brand-logo">
                    <h1>حاسبة الشهاب</h1>
                </div>
                <div class="header-controls">
                    <button class="btn btn-outline" onclick="toggleTheme()">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    <button class="btn btn-primary" onclick="toggleSettings()">
                        <i class="fas fa-lock"></i>
                        الإعدادات
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <div class="container">
            <!-- Settings Panel -->
            <section id="settingsPanel" class="settings-panel hidden">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-cog"></i> إعدادات النظام</h3>
                        <button class="close-btn" onclick="closeSettings()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="local-storage-note hidden">
                            <i class="fas fa-hdd"></i>
                            <span>هذه الإعدادات محفوظة في <strong>هذا المتصفح فقط</strong> ولن تظهر على الأجهزة الأخرى.</span>
                        </div>
                        <div class="cloud-account-bar hidden">
                            <span>
                                <i class="fas fa-cloud"></i>
                                مسجّل الدخول باسم <strong id="cloudUserEmail"></strong> — التعديلات تُطبَّق على كل الأجهزة
                            </span>
                            <button class="btn btn-outline btn-sm" onclick="adminSignOut()">
                                <i class="fas fa-sign-out-alt"></i>
                                خروج
                            </button>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="ceiling">
                                    <i class="fas fa-hand-holding-usd"></i>
                                    سقف المرابحة (د.ل)
                                </label>
                                <input type="number" id="ceiling" class="form-control" placeholder="أدخل سقف المرابحة">
                            </div>
                            <div class="form-group">
                                <label for="profitRate">
                                    <i class="fas fa-percentage"></i>
                                    هامش الربح السنوي (%)
                                </label>
                                <input type="number" id="profitRate" class="form-control" step="0.01" placeholder="هامش الربح">
                            </div>
                            <div class="form-group">
                                <label for="discountedRate">
                                    <i class="fas fa-tags"></i>
                                    هامش الربح بعد التخفيض (%)
                                </label>
                                <input type="number" id="discountedRate" class="form-control" step="0.01" placeholder="هامش الربح المخفض">
                            </div>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-success" onclick="saveSettings()">
                                <i class="fas fa-save"></i>
                                حفظ الإعدادات
                            </button>
                        </div>

                        <hr class="settings-divider">

                        <!-- إدارة السيارات -->
                        <h4 class="settings-subtitle">
                            <i class="fas fa-car"></i>
                            إدارة السيارات
                        </h4>

                        <form id="carForm" class="car-form">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="carName">
                                        <i class="fas fa-tag"></i>
                                        اسم السيارة والموديل
                                    </label>
                                    <input type="text" id="carName" class="form-control" placeholder="مثال: تويوتا كامري 2024" required>
                                </div>
                                <div class="form-group">
                                    <label for="carPriceAdd">
                                        <i class="fas fa-dollar-sign"></i>
                                        سعر الشراء (د.ل)
                                    </label>
                                    <input type="number" id="carPriceAdd" class="form-control" placeholder="أدخل سعر الشراء" required>
                                </div>
                                <div class="form-group">
                                    <label for="carClosingMode">
                                        <i class="fas fa-handshake"></i>
                                        سعر الإغلاق
                                    </label>
                                    <select id="carClosingMode" class="form-control">
                                        <option value="none">بدون</option>
                                        <option value="fixed">قيمة ثابتة</option>
                                        <option value="range">نطاق من – إلى</option>
                                    </select>
                                </div>
                                <div class="form-group" id="carClosingFixedGroup" style="display: none;">
                                    <label for="carClosingPrice">القيمة (د.ل)</label>
                                    <input type="number" id="carClosingPrice" class="form-control" placeholder="سعر الإغلاق">
                                </div>
                                <div class="form-group" id="carClosingRangeGroup" style="display: none;">
                                    <label>النطاق (د.ل)</label>
                                    <div class="range-inputs">
                                        <input type="number" id="carClosingMin" class="form-control" placeholder="من">
                                        <span class="range-sep">–</span>
                                        <input type="number" id="carClosingMax" class="form-control" placeholder="إلى">
                                    </div>
                                </div>
                            </div>

                            <!-- صورة السيارة -->
                            <div class="car-image-picker">
                                <div class="car-image-actions">
                                    <button type="button" class="btn btn-outline" onclick="searchCarImages()">
                                        <i class="fas fa-magnifying-glass"></i>
                                        ابحث عن صور السيارة
                                    </button>
                                    <label class="btn btn-outline upload-label">
                                        <i class="fas fa-upload"></i>
                                        رفع صورة
                                        <input type="file" id="carImageUpload" accept="image/*" hidden>
                                    </label>
                                    <button type="button" class="btn btn-outline" onclick="promptImageUrl()">
                                        <i class="fas fa-link"></i>
                                        لصق رابط
                                    </button>
                                    <div id="carImageChosen" class="car-image-chosen hidden">
                                        <img id="carImageChosenPreview" alt="">
                                        <button type="button" class="btn btn-outline btn-sm" onclick="clearChosenImage()">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>
                                <div id="imageResults" class="image-results hidden"></div>
                            </div>

                            <div class="button-group">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-plus"></i>
                                    <span id="carFormSubmitLabel">إضافة السيارة</span>
                                </button>
                                <button type="button" class="btn btn-outline hidden" id="carFormCancel" onclick="cancelCarEdit()">
                                    <i class="fas fa-times"></i>
                                    إلغاء التعديل
                                </button>
                            </div>
                        </form>

                        <div id="carsList" class="cars-list"></div>

                        <div class="button-group" style="margin-top: 1.5rem;">
                            <button class="btn btn-danger" onclick="clearAllData()">
                                <i class="fas fa-trash"></i>
                                مسح جميع السيارات
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Calculator Section -->
            <section class="calculator-section">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-calculator"></i> حاسبة التمويل</h3>
                    </div>
                    <div class="card-body">
                        <form id="calculatorForm" class="calculator-form">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="salary">
                                        <i class="fas fa-money-bill-wave"></i>
                                        مرتب العميل (د.ل)
                                    </label>
                                    <input type="number" id="salary" class="form-control" placeholder="أدخل مرتب العميل" required>
                                </div>
                                <div class="form-group">
                                    <label for="years">
                                        <i class="fas fa-calendar-alt"></i>
                                        مدة التمويل (سنوات)
                                    </label>
                                    <select id="years" class="form-control" required>
                                        <option value="">اختر المدة</option>
                                        <option value="1">سنة واحدة</option>
                                        <option value="2">سنتان</option>
                                        <option value="3">3 سنوات</option>
                                        <option value="4">4 سنوات</option>
                                        <option value="5">5 سنوات</option>
                                        <option value="6">6 سنوات</option>
                                        <option value="7">7 سنوات</option>
                                        <option value="8">8 سنوات</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="hasDiscount">
                                        <i class="fas fa-tag"></i>
                                        هل العميل يحصل على تخفيض؟
                                    </label>
                                    <select id="hasDiscount" class="form-control">
                                        <option value="no">لا</option>
                                        <option value="yes">نعم</option>
                                    </select>
                                </div>
                                <div class="form-group car-picker-group">
                                    <label for="carSelect">
                                        <i class="fas fa-car-side"></i>
                                        السيارة
                                    </label>
                                    <select id="carSelect" class="form-control">
                                        <option value="">إدخال يدوي</option>
                                    </select>
                                    <div id="carPreview" class="car-preview hidden">
                                        <img id="carPreviewImage" alt="">
                                        <div class="car-preview-info">
                                            <strong id="carPreviewName"></strong>
                                            <span id="carPreviewClosing"></span>
                                        </div>
                                        <button type="button" class="btn btn-outline btn-sm" onclick="clearCarSelection()">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="carPrice">
                                        <i class="fas fa-tag"></i>
                                        سعر شراء السيارة (د.ل)
                                    </label>
                                    <input type="number" id="carPrice" class="form-control" placeholder="أدخل سعر السيارة" required>
                                </div>
                                <div class="form-group">
                                    <label for="closingMode">
                                        <i class="fas fa-handshake"></i>
                                        سعر الإغلاق (د.ل) <span class="field-hint">(اختياري)</span>
                                    </label>
                                    <select id="closingMode" class="form-control">
                                        <option value="fixed">قيمة ثابتة</option>
                                        <option value="range">نطاق من – إلى</option>
                                    </select>
                                    <div id="closingFixedWrap" style="margin-top: 0.6rem;">
                                        <input type="number" id="closingPrice" class="form-control" placeholder="أدخل سعر الإغلاق">
                                    </div>
                                    <div id="closingRangeWrap" class="range-inputs hidden" style="margin-top: 0.6rem;">
                                        <input type="number" id="closingMin" class="form-control" placeholder="من">
                                        <span class="range-sep">–</span>
                                        <input type="number" id="closingMax" class="form-control" placeholder="إلى">
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-large">
                                <i class="fas fa-calculator"></i>
                                احسب التمويل
                            </button>
                        </form>
                        
                        <!-- Results Display -->
                        <div id="results" class="results-container hidden">
                            <div class="results-header">
                                <h4><i class="fas fa-chart-line"></i> نتائج الحساب</h4>
                            </div>
                            <div id="resultsContent" class="results-content"></div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Toast Notifications -->
    <div id="toast" class="toast hidden">
        <div class="toast-content">
            <span id="toastMessage"></span>
            <button onclick="hideToast()"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <script src="firebase-config.js?v=DEV"></script>
    <script src="search-config.js?v=DEV"></script>
    <script type="module" src="firebase-store.js?v=DEV"></script>
    <script src="script.js?v=DEV"></script>
</body>
</html>
