name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشر واحد في كل مرة، دون إلغاء نشر جارٍ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement يفعّل GitHub Pages تلقائياً دون ضبط يدوي من الإعدادات
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # بصمة الإصدار: تمنع المتصفحات من عرض نسخة مخبأة بعد كل نشر
      - name: Stamp asset version
        run: sed -i "s/?v=DEV/?v=${GITHUB_SHA::8}/g" public/index.html

      # يُنشر محتوى public/ فقط، أما server.js فيبقى في المستودع
      # لتشغيل التطبيق على خادم خاص عند الحاجة
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
